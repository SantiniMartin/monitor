{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar al lector OMR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'evaluaciones_educativas/css/omr_fluidez.css' %}" rel="stylesheet">
</head>
<body>
  <main class="omr-page d-flex align-items-center justify-content-center">
    <section class="omr-card" style="max-width: 430px; width: 100%;">
      <header class="omr-card-header">
        <div class="text-uppercase fw-semibold small opacity-75 mb-1">Evaluaciones educativas</div>
        <h1>Ingresar al lector OMR</h1>
        <p>Usá el CUE/anexo asignado como usuario y contraseña.</p>
      </header>
      <form method="post" class="p-4">
        {% csrf_token %}
        {% if form.non_field_errors %}
          <div class="alert alert-danger">El usuario o la contraseña no son válidos.</div>
        {% endif %}
        <div class="mb-3">
          <label class="form-label" for="id_username">CUE/anexo</label>
          <input class="form-control" id="id_username" name="username" inputmode="numeric" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="id_password">Contraseña</label>
          <input class="form-control" id="id_password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="omr-btn w-100 justify-content-center" type="submit">Ingresar</button>
      </form>
    </section>
  </main>
</body>
</html>
